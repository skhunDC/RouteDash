<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RouteDash</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      :root {
        --bg: #f4f7fb;
        --surface: #ffffff;
        --text: #12243a;
        --muted: #5f6b7a;
        --accent: #0b63f6;
        --border: #dbe3ef;
        --shadow: 0 12px 26px rgba(10, 35, 66, 0.1);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      header {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 16px 24px;
        border-bottom: 1px solid var(--border);
        background: linear-gradient(180deg, #fff, #f8fbff);
        position: sticky;
        top: 0;
        z-index: 10;
      }
      h1 { margin: 0; font-size: clamp(1.2rem, 2vw, 1.9rem); }
      .mode-pill {
        padding: 6px 12px;
        border-radius: 999px;
        font-size: 0.8rem;
        font-weight: 700;
        background: #e6efff;
      }
      button, select, input {
        font: inherit;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px 10px;
        background: #fff;
      }
      button { cursor: pointer; }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button:focus, input:focus, select:focus, [contenteditable="true"]:focus { outline: 2px solid #9fc0ff; outline-offset: 2px; }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }

      .screen {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 330px;
        gap: 14px;
        padding: 14px;
      }
      .control-panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: var(--shadow);
        padding: 12px;
        max-height: calc(100vh - 110px);
        overflow: auto;
      }
      .control-panel h2 { font-size: 1rem; margin: 0 0 10px; }
      .control-panel section { margin-bottom: 16px; display: grid; gap: 8px; }
      .dashboard-grid {
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        gap: 12px;
      }
      .tile {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: var(--shadow);
        padding: 12px;
        min-height: 180px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .tile-header {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: center;
      }
      .tile-header h3 { margin: 0; font-size: 1rem; }
      .tile.small { grid-column: span 3; }
      .tile.wide { grid-column: span 6; }
      .tile.tall { grid-column: span 4; min-height: 320px; }
      .tile.big { grid-column: span 8; min-height: 340px; }

      .meta-text { color: var(--muted); font-size: 0.92rem; }
      .sheet-table-wrap { overflow: auto; border: 1px solid var(--border); border-radius: 8px; }
      table.sheet-table { border-collapse: collapse; width: 100%; min-width: 480px; }
      .sheet-table th, .sheet-table td { border: 1px solid var(--border); padding: 6px; min-width: 70px; text-align: left; }
      .sheet-table th { background: #f3f7ff; font-size: 0.8rem; }
      .sheet-table td[contenteditable="true"] { background: #fffef4; }

      .image-viewer {
        position: relative;
        display: grid;
        place-items: center;
        min-height: 220px;
        border-radius: 10px;
        background: #edf2f9;
        overflow: hidden;
      }
      .image-viewer img {
        width: min(100%, 560px);
        max-height: 320px;
        object-fit: contain;
        opacity: 1;
        transition: opacity 400ms ease;
      }
      .image-viewer img.fade-out { opacity: 0; }
      @media (prefers-reduced-motion: reduce) {
        .image-viewer img { transition: none; }
      }

      .display-mode .edit-only { display: none !important; }
      .loading {
        position: fixed;
        inset: 0;
        background: rgba(10, 22, 40, 0.5);
        color: white;
        display: grid;
        place-items: center;
        z-index: 100;
      }
      @media (max-width: 1200px) {
        .screen { grid-template-columns: minmax(0, 1fr); }
        .control-panel { max-height: none; }
        .tile.small, .tile.wide, .tile.tall, .tile.big { grid-column: span 12; }
      }
    </style>
  </head>
  <body>
    <div id="loading" class="loading">Loading dashboard data from Sheets...</div>
    <header>
      <div>
        <h1 id="headerTitle">Route Operations Dashboard</h1>
        <div class="meta-text" id="timestamp"></div>
      </div>
      <div class="toolbar">
        <span id="modePill" class="mode-pill">Display mode</span>
        <button id="toggleModeBtn" class="primary">Switch to Edit mode</button>
        <button id="saveLayoutBtn" class="edit-only">Save Layout</button>
        <button id="applyEditsBtn" class="edit-only">Apply Queued Edits</button>
      </div>
    </header>

    <div class="screen">
      <main id="dashboard" class="dashboard-grid" aria-label="Dashboard tiles"></main>

      <aside class="control-panel edit-only" aria-label="Editor controls">
        <h2>Edit Controls</h2>
        <section>
          <label>Header title <input id="headerTitleInput" type="text" /></label>
          <label>Driver of the week <input id="driverInput" type="text" /></label>
          <button id="saveConfigBtn">Save Header + Driver</button>
        </section>
        <section>
          <button id="addTileBtn">Add Tile</button>
          <label>Tile order
            <select id="tileOrderSelect"></select>
          </label>
          <button id="moveTileUpBtn">Move Selected Up</button>
          <button id="removeTileBtn">Remove Selected Tile</button>
        </section>
        <section>
          <h2>Sheet Tabs</h2>
          <button id="createSheetBtn">Create Sheet Tab</button>
          <button id="renameSheetBtn">Rename Sheet Tab</button>
          <button id="deleteSheetBtn">Delete Sheet Tab</button>
        </section>
        <section>
          <h2>Images</h2>
          <input id="imageUploader" type="file" accept="image/*" multiple />
          <button id="uploadImagesBtn">Upload Selected</button>
          <button id="deleteCurrentImageBtn">Delete Current Image</button>
        </section>
      </aside>
    </div>

    <script>
      const DataApi = (() => {
        function run(fnName, ...args) {
          return new Promise((resolve, reject) => {
            google.script.run
              .withSuccessHandler(resolve)
              .withFailureHandler((err) => reject(new Error(err && err.message ? err.message : String(err))))
              [fnName](...args);
          });
        }

        return {
          getAppState: () => run('getAppState'),
          getSheetRange: (sheetName, range, options) => run('getSheetRange', sheetName, range, options || {}),
          applySheetEdits: (edits) => run('applySheetEdits', edits),
          saveAppLayout: (layout) => run('saveAppLayout', layout),
          saveAppConfig: (patch) => run('saveAppConfig', patch),
          createSheetTab: (name) => run('createSheetTab', name),
          renameSheetTab: (oldName, newName) => run('renameSheetTab', oldName, newName),
          deleteSheetTab: (name) => run('deleteSheetTab', name),
          getImageById: (imageId) => run('getImageById', imageId),
          addImages: (list) => run('addImages', list),
          deleteImage: (imageId) => run('deleteImage', imageId)
        };
      })();

      const Store = {
        state: {
          app: null,
          mode: 'display',
          editQueue: [],
          sheetCache: {},
          chartRefs: {},
          imageCache: {},
          imageCursor: {}
        },
        listeners: [],
        set(patch) { this.state = { ...this.state, ...patch }; this.listeners.forEach((fn) => fn(this.state)); },
        onChange(fn) { this.listeners.push(fn); }
      };

      function showLoading(message) {
        const node = document.getElementById('loading');
        node.textContent = message || 'Working...';
        node.style.display = 'grid';
      }

      function hideLoading() {
        document.getElementById('loading').style.display = 'none';
      }

      function toColumnLabel(idx) {
        let n = idx;
        let out = '';
        while (n > 0) {
          const rem = (n - 1) % 26;
          out = String.fromCharCode(65 + rem) + out;
          n = Math.floor((n - 1) / 26);
        }
        return out;
      }

      function parseA1(a1) {
        const m = /^([A-Z]+)(\d+):([A-Z]+)(\d+)$/i.exec(a1 || 'A1:F12');
        if (!m) return { startRow: 1, startCol: 1, rows: 12, cols: 6 };
        const colNum = (s) => s.toUpperCase().split('').reduce((acc, c) => acc * 26 + c.charCodeAt(0) - 64, 0);
        const startCol = colNum(m[1]);
        const endCol = colNum(m[3]);
        const startRow = Number(m[2]);
        const endRow = Number(m[4]);
        return { startRow, startCol, rows: endRow - startRow + 1, cols: endCol - startCol + 1 };
      }

      function enqueueEdit(edit) {
        Store.state.editQueue.push(edit);
        document.getElementById('applyEditsBtn').textContent = `Apply Queued Edits (${Store.state.editQueue.length})`;
      }

      function chartDataFromGrid(values) {
        if (!values || !values.length) return { labels: [], datasets: [] };
        const labels = values.slice(1).map((row, idx) => row[0] || `Row ${idx + 1}`);
        const datasets = values[0].slice(1).map((header, colIdx) => ({
          label: header || `Series ${colIdx + 1}`,
          data: values.slice(1).map((row) => Number(row[colIdx + 1]) || 0),
          borderWidth: 2,
          tension: 0.3
        }));
        return { labels, datasets };
      }

      async function ensureRange(tile) {
        const key = `${tile.sheetName}|${tile.range}`;
        if (!Store.state.sheetCache[key]) {
          Store.state.sheetCache[key] = await DataApi.getSheetRange(tile.sheetName, tile.range, { includeFormulas: true });
        }
        return Store.state.sheetCache[key];
      }

      function renderStaticTile(tile, body) {
        return `<article class="tile ${tile.size || 'wide'}"><div class="tile-header"><h3>${tile.title || tile.type}</h3></div>${body}</article>`;
      }

      async function renderTile(tile) {
        if (tile.type === 'weather') {
          const weather = Store.state.app.weather || {};
          return renderStaticTile(tile, `<div class="meta-text">${weather.condition || 'Unavailable'}</div><strong>${weather.temperature || '-'}°F</strong><div class="meta-text">Wind ${weather.windspeed || '-'} mph</div>`);
        }
        if (tile.type === 'quote') {
          return renderStaticTile(tile, `<p>${Store.state.app.quote || 'No quote available.'}</p>`);
        }
        if (tile.type === 'image') {
          return renderStaticTile(tile, `<div class="image-viewer" data-image-tile="${tile.id}"><div class="meta-text">Loading image...</div></div>`);
        }
        if (!tile.sheetName) {
          return renderStaticTile(tile, '<div class="meta-text">Missing sheet mapping.</div>');
        }

        const rangeData = await ensureRange(tile);
        if (tile.type === 'chart') {
          return `<article class="tile ${tile.size || 'big'}"><div class="tile-header"><h3>${tile.title}</h3><span class="meta-text">${tile.sheetName}!${tile.range}</span></div><canvas id="canvas-${tile.id}" aria-label="Chart ${tile.title}"></canvas></article>`;
        }

        const gridMeta = parseA1(tile.range);
        let table = '<div class="sheet-table-wrap"><table class="sheet-table"><thead><tr><th>#</th>';
        for (let c = 0; c < gridMeta.cols; c++) table += `<th>${toColumnLabel(gridMeta.startCol + c)}</th>`;
        table += '</tr></thead><tbody>';
        for (let r = 0; r < rangeData.displayValues.length; r++) {
          table += `<tr><th>${gridMeta.startRow + r}</th>`;
          for (let c = 0; c < rangeData.displayValues[r].length; c++) {
            const formula = rangeData.formulas[r][c];
            const text = formula || rangeData.displayValues[r][c] || '';
            table += `<td contenteditable="${Store.state.mode === 'edit'}" data-tile="${tile.id}" data-row="${gridMeta.startRow + r}" data-col="${gridMeta.startCol + c}">${text}</td>`;
          }
          table += '</tr>';
        }
        table += '</tbody></table></div>';
        return `<article class="tile ${tile.size || 'big'}"><div class="tile-header"><h3>${tile.title}</h3><span class="meta-text">${tile.sheetName}!${tile.range}</span></div>${table}</article>`;
      }

      function applyModeStyling() {
        const isDisplay = Store.state.mode === 'display';
        document.body.classList.toggle('display-mode', isDisplay);
        document.getElementById('modePill').textContent = isDisplay ? 'Display mode' : 'Edit mode';
        document.getElementById('toggleModeBtn').textContent = isDisplay ? 'Switch to Edit mode' : 'Switch to Display mode';
      }

      async function renderDashboard() {
        const dashboard = document.getElementById('dashboard');
        dashboard.innerHTML = '';
        const html = [];
        for (const tile of Store.state.app.layout.tiles) html.push(await renderTile(tile));
        dashboard.innerHTML = html.join('');

        for (const tile of Store.state.app.layout.tiles.filter((t) => t.type === 'chart' && t.sheetName)) {
          const node = document.getElementById(`canvas-${tile.id}`);
          if (!node) continue;
          const key = `${tile.sheetName}|${tile.range}`;
          const chartInput = chartDataFromGrid(Store.state.sheetCache[key].displayValues);
          if (Store.state.chartRefs[tile.id]) Store.state.chartRefs[tile.id].destroy();
          Store.state.chartRefs[tile.id] = new Chart(node, { type: tile.chartType || 'bar', data: chartInput, options: { responsive: true, maintainAspectRatio: false } });
        }

        dashboard.querySelectorAll('td[data-tile]').forEach((cell) => {
          cell.addEventListener('blur', () => {
            if (Store.state.mode !== 'edit') return;
            const tile = Store.state.app.layout.tiles.find((t) => t.id === cell.dataset.tile);
            enqueueEdit({ sheetName: tile.sheetName, row: Number(cell.dataset.row), col: Number(cell.dataset.col), inputText: cell.textContent.trim() });
          });
        });

        initImageTiles();
      }

      async function initImageTiles() {
        const imageTiles = Store.state.app.layout.tiles.filter((t) => t.type === 'image');
        for (const tile of imageTiles) {
          if (!Store.state.app.imagesIndex.length) {
            const host = document.querySelector(`[data-image-tile="${tile.id}"]`);
            if (host) host.innerHTML = '<div class="meta-text">No images uploaded.</div>';
            continue;
          }
          if (Store.state.imageCursor[tile.id] === undefined) Store.state.imageCursor[tile.id] = 0;
          await showImageAt(tile, Store.state.imageCursor[tile.id]);
          scheduleRotation(tile);
        }
      }

      async function showImageAt(tile, index) {
        const host = document.querySelector(`[data-image-tile="${tile.id}"]`);
        if (!host) return;
        const list = Store.state.app.imagesIndex;
        const safeIndex = ((index % list.length) + list.length) % list.length;
        const item = list[safeIndex];

        if (!Store.state.imageCache[item.imageId]) {
          Store.state.imageCache[item.imageId] = await DataApi.getImageById(item.imageId);
        }

        const payload = Store.state.imageCache[item.imageId];
        const img = host.querySelector('img') || document.createElement('img');
        img.classList.add('fade-out');
        setTimeout(() => {
          img.src = payload.dataUrl;
          img.alt = payload.name || 'Driver image';
          img.classList.remove('fade-out');
        }, window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 120);
        if (!host.querySelector('img')) host.innerHTML = '', host.appendChild(img);

        Store.state.imageCursor[tile.id] = safeIndex;

        const next = list[(safeIndex + 1) % list.length];
        if (next && !Store.state.imageCache[next.imageId]) {
          DataApi.getImageById(next.imageId).then((data) => { Store.state.imageCache[next.imageId] = data; }).catch(() => {});
        }
      }

      function scheduleRotation(tile) {
        if (tile._rotationHandle) clearInterval(tile._rotationHandle);
        const seconds = Number(Store.state.app.config.rotationSeconds || 12);
        tile._rotationHandle = setInterval(() => {
          if (!Store.state.app.imagesIndex.length) return;
          const next = (Store.state.imageCursor[tile.id] + 1) % Store.state.app.imagesIndex.length;
          showImageAt(tile, next);
        }, Math.max(4, seconds) * 1000);
      }

      function refreshTileOrderControl() {
        const select = document.getElementById('tileOrderSelect');
        select.innerHTML = Store.state.app.layout.tiles.map((t) => `<option value="${t.id}">${t.title} (${t.size})</option>`).join('');
      }

      async function bootstrap() {
        showLoading('Loading app state and workbook metadata...');
        const app = await DataApi.getAppState();
        Store.set({ app, mode: app.layout.mode || 'display', sheetCache: {}, editQueue: [] });

        document.getElementById('headerTitle').textContent = app.config.headerTitle;
        document.getElementById('timestamp').textContent = `Updated ${new Date(app.timestamp).toLocaleString()}`;
        document.getElementById('headerTitleInput').value = app.config.headerTitle || '';
        document.getElementById('driverInput').value = app.config.driverOfWeek || '';

        applyModeStyling();
        refreshTileOrderControl();
        await renderDashboard();
        hideLoading();
      }

      document.getElementById('toggleModeBtn').addEventListener('click', async () => {
        Store.state.mode = Store.state.mode === 'display' ? 'edit' : 'display';
        Store.state.app.layout.mode = Store.state.mode;
        applyModeStyling();
        await renderDashboard();
      });

      document.getElementById('saveLayoutBtn').addEventListener('click', async () => {
        await DataApi.saveAppLayout(Store.state.app.layout);
        alert('Layout saved.');
      });

      document.getElementById('saveConfigBtn').addEventListener('click', async () => {
        const patch = {
          headerTitle: document.getElementById('headerTitleInput').value.trim() || 'Route Operations Dashboard',
          driverOfWeek: document.getElementById('driverInput').value.trim()
        };
        Store.state.app.config = await DataApi.saveAppConfig(patch);
        document.getElementById('headerTitle').textContent = Store.state.app.config.headerTitle;
      });

      document.getElementById('applyEditsBtn').addEventListener('click', async () => {
        if (!Store.state.editQueue.length) return;
        const edits = Store.state.editQueue.splice(0);
        await DataApi.applySheetEdits(edits);
        Store.state.sheetCache = {};
        await renderDashboard();
        document.getElementById('applyEditsBtn').textContent = 'Apply Queued Edits';
      });

      document.getElementById('addTileBtn').addEventListener('click', async () => {
        const sheetName = Store.state.app.sheetTabs[0] || 'Sheet1';
        Store.state.app.layout.tiles.push({
          id: `tile-${Date.now()}`,
          type: 'sheet',
          title: 'New Tile',
          size: 'wide',
          sheetName,
          range: 'A1:F10'
        });
        refreshTileOrderControl();
        await renderDashboard();
      });

      document.getElementById('moveTileUpBtn').addEventListener('click', async () => {
        const selectId = document.getElementById('tileOrderSelect').value;
        const idx = Store.state.app.layout.tiles.findIndex((t) => t.id === selectId);
        if (idx > 0) {
          const temp = Store.state.app.layout.tiles[idx - 1];
          Store.state.app.layout.tiles[idx - 1] = Store.state.app.layout.tiles[idx];
          Store.state.app.layout.tiles[idx] = temp;
          refreshTileOrderControl();
          document.getElementById('tileOrderSelect').value = selectId;
          await renderDashboard();
        }
      });

      document.getElementById('removeTileBtn').addEventListener('click', async () => {
        const selectId = document.getElementById('tileOrderSelect').value;
        Store.state.app.layout.tiles = Store.state.app.layout.tiles.filter((t) => t.id !== selectId);
        refreshTileOrderControl();
        await renderDashboard();
      });

      document.getElementById('createSheetBtn').addEventListener('click', async () => {
        const name = prompt('New sheet tab name:');
        if (!name) return;
        Store.state.app.sheetTabs = await DataApi.createSheetTab(name);
        alert('Sheet created.');
      });
      document.getElementById('renameSheetBtn').addEventListener('click', async () => {
        const oldName = prompt('Current tab name:');
        if (!oldName) return;
        const newName = prompt('New tab name:');
        if (!newName) return;
        Store.state.app.sheetTabs = await DataApi.renameSheetTab(oldName, newName);
        alert('Sheet renamed.');
      });
      document.getElementById('deleteSheetBtn').addEventListener('click', async () => {
        const name = prompt('Tab name to delete:');
        if (!name) return;
        Store.state.app.sheetTabs = await DataApi.deleteSheetTab(name);
        alert('Sheet deleted.');
      });

      document.getElementById('uploadImagesBtn').addEventListener('click', async () => {
        const files = Array.from(document.getElementById('imageUploader').files || []);
        if (!files.length) return;
        const list = await Promise.all(files.map((file) => new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.readAsDataURL(file);
        })));
        Store.state.app.imagesIndex = await DataApi.addImages(list);
        Store.state.imageCache = {};
        await renderDashboard();
      });

      document.getElementById('deleteCurrentImageBtn').addEventListener('click', async () => {
        const imageTiles = Store.state.app.layout.tiles.filter((t) => t.type === 'image');
        if (!imageTiles.length || !Store.state.app.imagesIndex.length) return;
        const tile = imageTiles[0];
        const idx = Store.state.imageCursor[tile.id] || 0;
        const target = Store.state.app.imagesIndex[idx];
        if (!target) return;
        Store.state.app.imagesIndex = await DataApi.deleteImage(target.imageId);
        Store.state.imageCache = {};
        await renderDashboard();
      });

      bootstrap().catch((err) => {
        console.error(err);
        showLoading(`Failed to initialize: ${err.message}`);
      });
    </script>
  </body>
</html>
