<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
        body {
          margin: 0;
          font-family: Arial, sans-serif;
          background-image: url('https://www.dublincleaners.com/wp-content/uploads/2025/06/redbg.jpg');
          background-size: cover;
          background-repeat: no-repeat;
          background-attachment: fixed;
          display: flex;
          flex-direction: column;
          min-height: 100vh;
          overflow: auto;
          cursor: auto;
        }
      .header {
        position: relative;
        z-index: 1500;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background-color: #b30000;
        color: white;
        padding: 10px 20px;
      }
      .header img { height: 120px; }
      .header-title { text-align: center; flex-grow: 1; }
      .header-title h1 { margin: 0; font-size: 45px; color: #ffffff; }
      .header-title .datetime {
        font-size: 24px;
        margin-top: 8px;
        color: #ffffff;
        font-weight: bold;
        line-height: 1.2;
      }
      .datetime .date,
      .datetime .time {
        display: inline-block;
      }
      .datetime .date {
        margin-right: 8px;
      }
      .weather {
        text-align: center;
        color: #ffffff;
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-top: 6px;
        font-size: 20px;
        font-weight: bold;
      }
      .weather span { line-height: 1.2; }
      #weather-icon { font-size: 24px; }
      .header-controls {
        text-align: center;
        color: #ffd1d1;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .header-controls div { line-height: 1.2; }
      .add-frame-btn,
      .lock-btn {
        margin-top: 8px;
        padding: 6px 12px;
        background-color: #ffffff;
        color: #b30000;
        border: none;
        cursor: pointer;
        font-size: 14px;
        width: 110px;
      }
      .add-frame-btn:hover,
      .lock-btn:hover {
        background-color: #ffd1d1;
      }
      .upload-container { position: relative; display: inline-block; }
      .upload-panel {
        display: none;
        position: absolute;
        right: 0;
        background-color: #ffffff;
        border: 1px solid #b30000;
        z-index: 2000;
      }
      .upload-option {
        display: block;
        padding: 6px 12px;
        background-color: #ffffff;
        color: #b30000;
        border: none;
        width: 100%;
        text-align: left;
        cursor: pointer;
      }
      .upload-option:hover { background-color: #ffd1d1; }
      .viewing-area {
        position: relative;
        flex: 1;
        overflow: auto;
        background-color: transparent;
      }
      .frame {
        position: absolute;
        border: 5px solid #b30000;
        background: #fff;
        box-sizing: border-box;
        cursor: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCI+PGxpbmUgeDE9IjEyIiB5MT0iMCIgeDI9IjEyIiB5Mj0iMjQiIHN0cm9rZT0iI2IzMDAwMCIgc3Ryb2tlLXdpZHRoPSIyIi8+PGxpbmUgeDE9IjAiIHkxPSIxMiIgeDI9IjI0IiB5Mj0iMTIiIHN0cm9rZT0iI2IzMDAwMCIgc3Ryb2tlLXdpZHRoPSIyIi8+PGNpcmNsZSBjeD0iMTIiIGN5PSIxMiIgcj0iMTEiIHN0cm9rZT0iYmxhY2siIGZpbGw9Im5vbmUiIHN0cm9rZS13aWR0aD0iMiIvPjwvc3ZnPg==') 12 12, crosshair;
        font-size: 133%;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .frame-header {
        background: #333;
        color: #fff;
        padding: 2px 24px 2px 4px;
        cursor: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCI+PGxpbmUgeDE9IjEyIiB5MT0iMCIgeDI9IjEyIiB5Mj0iMjQiIHN0cm9rZT0iI2IzMDAwMCIgc3Ryb2tlLXdpZHRoPSIyIi8+PGxpbmUgeDE9IjAiIHkxPSIxMiIgeDI9IjI0IiB5Mj0iMTIiIHN0cm9rZT0iI2IzMDAwMCIgc3Ryb2tlLXdpZHRoPSIyIi8+PGNpcmNsZSBjeD0iMTIiIGN5PSIxMiIgcj0iMTEiIHN0cm9rZT0iYmxhY2siIGZpbGw9Im5vbmUiIHN0cm9rZS13aWR0aD0iMiIvPjwvc3ZnPg==') 12 12, crosshair;
        position: relative;
        text-align: center;
        user-select: none;
      }
      .frame-title {
        width: 100%;
        outline: none;
        text-align: center;
        cursor: text;
      }
      .close-btn {
        position: absolute;
        right: 2px;
        top: 2px;
        background: none;
        border: none;
        color: #fff;
        cursor: pointer;
        font-size: 21px;
      }
      .frame .resizer {
        width: 10px;
        height: 10px;
        background: #333;
        position: absolute;
        right: 0;
        bottom: 0;
        cursor: se-resize;
      }
      .sheet-buttons {
        display: flex;
        justify-content: center;
        gap: 2px;
        margin: 2px 0;
      }
      .sheet-btn {
        cursor: pointer;
        font-size: 10px;
        padding: 2px 4px;
      }
      .spreadsheet {
        cursor: text;
        overflow: auto;
        flex: 1 1 50%;
        background: #fff;
        min-height: 120px;
      }
      .spreadsheet table {
        border-collapse: collapse;
        width: 100%;
      }
      .spreadsheet th,
      .spreadsheet td {
        cursor: text;
        border: 1px solid #999;
        padding: 2px 4px;
        width: 40px;
        height: 20px;
        text-align: center;
        vertical-align: middle;
      }
      .spreadsheet th {
        background: #f0f0f0;
      }
      .weekly-quote {
        position: fixed;
        bottom: 10px;
        right: 10px;
        color: #ffffff;
        background: rgba(0, 0, 0, 0.5);
        padding: 8px 12px;
        font-style: italic;
        font-size: 17px;
        border-radius: 4px;
        text-align: center;
        z-index: 1600;
      }
      .driver-carousel {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 250px;
        display: flex;
        align-items: flex-end;
        overflow: hidden;
        pointer-events: none;
        z-index: 500;
      }
      .carousel-track {
        display: flex;
        align-items: center;
      }
      @keyframes scroll-left {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(-50%);
        }
      }

      .driver-week {
        position: fixed;
        bottom: 60px;
        right: 10px;
        color: #ffffff;
        background: rgba(0, 0, 0, 0.5);
        padding: 8px 12px;
        border-radius: 4px;
        z-index: 1000;
        pointer-events: auto;
        width: 300px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .driver-week input {
        width: 100%;
        margin-top: 4px;
        box-sizing: border-box;
        font-size: 32px;
        padding: 3px;
        text-align: center;
      }

      .driver-week label {
        font-size: 32px;
        display: block;
      }

      .driver-carousel img {
        width: 250px;
        height: 250px;
        object-fit: cover;
        object-position: top;
        flex-shrink: 0;
      }
      #loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2000;
      }
      #loading-canvas {
        width: 100%;
        height: 120px;
      }

      .dashboard {
        flex: 1 1 45%;
        min-height: 160px;
        border-top: 1px solid #e6e6e6;
        padding: 8px 10px 12px;
        background: #fafafa;
        color: #2d2d2d;
        overflow: auto;
      }

      .dashboard-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 6px;
        gap: 8px;
        font-weight: bold;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #333;
      }

      .dashboard-header-left {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .dashboard-header button {
        font-size: 11px;
        padding: 4px 8px;
        border: 1px solid #c7c7c7;
        background: #fff;
        color: #333;
        cursor: pointer;
        text-transform: none;
        font-weight: 600;
        letter-spacing: normal;
      }

      .dashboard-header button:hover {
        background: #f2f2f2;
      }


      .dashboard-header select {
        font-size: 12px;
        padding: 3px 6px;
      }

      .dashboard-form {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 8px;
        align-items: flex-end;
      }

      .dashboard-form label {
        font-size: 11px;
        font-weight: 600;
        color: #555;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .dashboard-form input,
      .dashboard-form select {
        padding: 4px 6px;
        font-size: 12px;
      }

      .dashboard-empty {
        font-size: 12px;
        color: #666;
        font-style: italic;
      }

      .dashboard-list table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }

      .dashboard-list th,
      .dashboard-list td {
        border-bottom: 1px solid #ddd;
        padding: 4px 2px;
        text-align: left;
      }

      .dashboard-list td.value {
        text-align: right;
        font-weight: 600;
      }

      .dashboard-chart {
        position: relative;
        height: 190px;
        margin-top: 10px;
      }

      .dashboard-chart canvas {
        width: 100% !important;
        height: 100% !important;
      }


      .dashboard-hidden {
        flex: 0 0 auto;
      }

      .dashboard-hidden .dashboard-header {
        margin-bottom: 4px;
      }

      .dashboard-hidden-message {
        font-size: 12px;
        color: #777;
        font-style: italic;
      }


    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script>
        function updateDateTime() {
          var now = new Date();
          document.getElementById('datetime').innerHTML =
            '<span class="date">' + now.toLocaleDateString() + '</span> ' +
            '<span class="time">' + now.toLocaleTimeString() + '</span>';
        }

        function getWeatherIcon(condition) {
          if (/Thunderstorm/i.test(condition)) return '⛈️';
          if (/Snow/i.test(condition)) return '❄️';
          if (/Rain|Drizzle/i.test(condition)) return '🌧️';
          if (/Fog/i.test(condition)) return '🌫️';
          if (/Cloud/i.test(condition)) return '☁️';
          if (/Clear/i.test(condition)) return '☀️';
          return '';
        }

        function updateWeather(data) {
          var iconEl = document.getElementById('weather-icon');
          var tempEl = document.getElementById('weather-temp');
          var condEl = document.getElementById('weather-condition');
          if (data) {
            iconEl.textContent = getWeatherIcon(data.condition);
            tempEl.textContent = data.temperature + '°F';
            condEl.textContent = data.condition;
          } else {
            iconEl.textContent = '';
            tempEl.textContent = '';
            condEl.textContent = 'Weather unavailable';
          }
        }

      function initHeaderTitle() {
        var titleEl = document.getElementById('header-title');
        google.script.run.withSuccessHandler(function(t) {
          if (t) titleEl.textContent = t;
        }).getHeaderTitle();
        function save() {
          google.script.run.saveHeaderTitle(titleEl.textContent.trim());
        }
        titleEl.addEventListener('keydown', function(e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            titleEl.blur();
          }
        });
        titleEl.addEventListener('blur', save);
      }

      function initUploads() {
        var panel = document.getElementById('upload-panel');
        document.getElementById('upload-toggle').addEventListener('click', function() {
          panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        });
        var logoInput = document.getElementById('logo-upload');
        var driverInput = document.getElementById('driver-upload');
        document.getElementById('logo-option').addEventListener('click', function() {
          panel.style.display = 'none';
          logoInput.click();
        });
        document.getElementById('driver-option').addEventListener('click', function() {
          panel.style.display = 'none';
          driverInput.click();
        });
        logoInput.addEventListener('change', function() {
          var file = this.files[0];
          if (!file) return;
          var reader = new FileReader();
          reader.onload = function(e) {
            var src = e.target.result;
            document.querySelector('.logo img').src = src;
            google.script.run.saveLogoImage(src);
          };
          reader.readAsDataURL(file);
          this.value = '';
        });
        driverInput.addEventListener('change', function() {
          var files = Array.from(this.files || []);
          var input = this;
          if (files.length === 0) return;
          var data = [];
          var remaining = files.length;
          files.forEach(function(file) {
            var reader = new FileReader();
            reader.onload = function(e) {
              data.push(e.target.result);
              if (--remaining === 0) {
                google.script.run
                  .withSuccessHandler(function(list) {
                    driverImages = list || data;
                    startCarousel();
                    input.value = '';
                  })
                  .updateDriverImages(data);
              }
            };
            reader.readAsDataURL(file);
          });
        });
        incrementLoad();
        google.script.run.withSuccessHandler(function(src) {
          if (src) document.querySelector('.logo img').src = src;
          decrementLoad();
        }).getLogoImage();
        incrementLoad();
        google.script.run.withSuccessHandler(function(list) {
          preloadImages(list || [], function(images) {
            driverImages = images;
            startCarousel();
            decrementLoad();
          });
        }).getDriverImages();
      }

      function initLockToggle() {
        var btn = document.getElementById('lock-toggle');
        if (!btn) return;
        btn.addEventListener('click', function() {
          framesLocked = !framesLocked;
          btn.textContent = framesLocked ? 'Unlock' : 'Lock';
          if (!framesLocked) keepFramesInView();
        });
        btn.textContent = 'Unlock';
      }

      function init() {
        updateDateTime();
        setInterval(updateDateTime, 1000);
        updateQuote();
        // refresh quote once a day
        setInterval(updateQuote, 86400000);
        google.script.run.withSuccessHandler(updateWeather).getWeather();
        incrementLoad();
        google.script.run.withSuccessHandler(function(data) {
          loadFrames(data);
          decrementLoad();
        }).getFrames();
        document.getElementById('add-frame').addEventListener('click', addFrame);
        initDriver();
        initHeaderTitle();
        initUploads();
        initLockToggle();
      }

      var frames = [];
      var framesLoaded = false;
      var framesLocked = true;
      // Start frames above the driver carousel (z-index: 500)
      var zIndex = 1100;

      var driverImages = [];
      var pendingLoads = 0;
      var loadingInterval = null;
      var chartInstances = {};
      var frameIdCounter = 0;

      function generateFrameId() {
        frameIdCounter += 1;
        return 'frame-' + Date.now().toString(36) + '-' + frameIdCounter.toString(36);
      }

      function createDefaultDashboard() {
        return {
          chartType: 'line',
          labelColumn: 0,
          valueColumn: 1,
          visible: true,
          sheetSize: 'balanced'
        };

      }

      function ensureFrameMetadata(frame) {
        var updated = false;
        if (!frame.id) {
          frame.id = generateFrameId();
          updated = true;
        }
        if (!frame.dashboard || typeof frame.dashboard !== 'object') {
          frame.dashboard = createDefaultDashboard();
          updated = true;
        }
        var allowedCharts = ['line', 'bar', 'pie'];
        if (allowedCharts.indexOf(frame.dashboard.chartType) === -1) {
          frame.dashboard.chartType = 'line';
          updated = true;
        }

        if (typeof frame.dashboard.labelColumn !== 'number' || isNaN(frame.dashboard.labelColumn)) {
          frame.dashboard.labelColumn = 0;
          updated = true;
        }
        if (typeof frame.dashboard.valueColumn !== 'number' || isNaN(frame.dashboard.valueColumn)) {
          frame.dashboard.valueColumn = 1;
          updated = true;
        }

        if (typeof frame.dashboard.visible !== 'boolean') {
          frame.dashboard.visible = true;
          updated = true;
        }
        var allowedSizes = ['compact', 'balanced', 'expanded'];
        if (allowedSizes.indexOf(frame.dashboard.sheetSize) === -1) {
          frame.dashboard.sheetSize = 'balanced';
          updated = true;
        }

        if (frame.dashboard.hasOwnProperty('data')) {
          delete frame.dashboard.data;
          updated = true;
        }
        return updated;
      }

      function applyFrameLayout(frameElement, frame) {
        if (!frameElement || !frame) return;
        var sheetEl = frameElement.querySelector('.spreadsheet');
        var dashEl = frameElement.querySelector('.dashboard');
        if (!sheetEl || !dashEl) return;
        var dashboard = frame.dashboard || {};
        var size = dashboard.sheetSize || 'balanced';
        var sizes = {
          compact: { sheet: '0.8 1 35%', dashboard: '1 1 55%' },
          balanced: { sheet: '1 1 50%', dashboard: '1 1 45%' },
          expanded: { sheet: '1.4 1 65%', dashboard: '1 1 35%' }
        };
        var selected = sizes[size] || sizes.balanced;
        if (dashboard.visible === false) {
          sheetEl.style.display = '';
          sheetEl.style.flex = '1 1 100%';
          dashEl.style.flex = '0 0 auto';
          return;
        }
        sheetEl.style.display = '';
        sheetEl.style.flex = selected.sheet;
        dashEl.style.flex = selected.dashboard;
      }

      function formatDateLabel(dateStr) {
        if (!dateStr) return '';
        var date = new Date(dateStr);
        if (isNaN(date.getTime())) return dateStr;
        return date.toLocaleDateString();
      }

      function columnNameFromIndex(index) {
        if (index < 0) return '';
        var name = '';
        var current = index;
        do {
          name = String.fromCharCode((current % 26) + 65) + name;
          current = Math.floor(current / 26) - 1;
        } while (current >= 0);
        return name;
      }

      function getColumnHeader(sheet, index) {
        if (!sheet || !sheet.data || !sheet.data.length) return '';
        var firstRow = sheet.data[0] || [];
        if (index < 0 || index >= firstRow.length) return '';
        var raw = firstRow[index];
        return raw == null ? '' : String(raw).trim();
      }

      function ensureDashboardColumnBounds(frame) {
        if (!frame || !frame.sheet || typeof frame.sheet.cols !== 'number') return false;
        var dashboard = frame.dashboard || {};
        var maxIndex = Math.max(0, frame.sheet.cols - 1);
        var updated = false;
        var label = typeof dashboard.labelColumn === 'number' ? dashboard.labelColumn : 0;
        var value = typeof dashboard.valueColumn === 'number' ? dashboard.valueColumn : 1;
        if (label < 0) {
          label = 0;
          updated = true;
        }
        if (label > maxIndex) {
          label = maxIndex;
          updated = true;
        }
        if (value < 0) {
          value = 0;
          updated = true;
        }
        if (value > maxIndex) {
          value = maxIndex;
          updated = true;
        }
        if (dashboard.labelColumn !== label) {
          dashboard.labelColumn = label;
          updated = true;
        }
        if (dashboard.valueColumn !== value) {
          dashboard.valueColumn = value;
          updated = true;
        }
        return updated;
      }

      function extractDashboardData(frame) {
        if (!frame || !frame.sheet) return [];
        var sheet = frame.sheet;
        evaluateSheet(sheet);
        ensureDashboardColumnBounds(frame);
        var labelIndex = frame.dashboard.labelColumn;
        var valueIndex = frame.dashboard.valueColumn;
        var entries = [];
        for (var r = 1; r < sheet.rows; r++) {
          var rowComputed = sheet.computed[r] || [];
          var rowRaw = sheet.data[r] || [];
          var labelValue = rowComputed[labelIndex];
          if (labelValue == null || labelValue === '') {
            labelValue = rowRaw[labelIndex];
          }
          var label = labelValue == null ? '' : String(labelValue).trim();
          var valueRaw = rowComputed[valueIndex];
          if (valueRaw == null || valueRaw === '') valueRaw = rowRaw[valueIndex];
          var numeric = typeof valueRaw === 'number' ? valueRaw : parseFloat(valueRaw);
          if (isNaN(numeric)) continue;
          var entry = {
            label: label,
            value: numeric,
            row: r
          };
          var potentialDate = label || rowRaw[labelIndex];
          if (potentialDate && !isNaN(Date.parse(potentialDate))) {
            entry.date = potentialDate;
          }
          entries.push(entry);
        }
        return entries;
      }

      function getEntryAxisLabel(entry, idx) {
        if (entry.label && entry.label.trim()) return entry.label.trim();
        var formatted = formatDateLabel(entry.date);
        if (formatted) return formatted;
        if (typeof entry.row === 'number') return 'Row ' + (entry.row + 1);
        return 'Entry ' + (idx + 1);
      }

      function getEntrySummary(entry, idx) {
        var formatted = formatDateLabel(entry.date);
        if (entry.label && formatted) return formatted + ' — ' + entry.label;
        if (entry.label) return entry.label;
        if (formatted) return formatted;
        if (typeof entry.row === 'number') return 'Row ' + (entry.row + 1);
        return 'Entry ' + (idx + 1);
      }

      function buildColorPalette(count) {
        var base = [
          '#b30000',
          '#ff6f61',
          '#ffd166',
          '#06d6a0',
          '#118ab2',
          '#073b4c',
          '#8338ec',
          '#ef476f'
        ];
        var palette = [];
        for (var i = 0; i < count; i++) {
          palette.push(base[i % base.length]);
        }
        return palette;
      }

      function buildChartConfig(frame, data) {
        var type = frame.dashboard.chartType || 'line';
        var labels = data.map(function(entry, idx) {
          return getEntryAxisLabel(entry, idx);
        });
        var values = data.map(function(entry) {
          return entry.value;
        });
        var datasetLabel = getColumnHeader(frame.sheet, frame.dashboard.valueColumn);
        if (!datasetLabel) {
          datasetLabel = frame.title || 'Data';
        }
        if (type === 'pie') {
          return {
            type: 'pie',
            data: {
              labels: labels,
              datasets: [
                {
                  data: values,
                  backgroundColor: buildColorPalette(values.length),
                  borderColor: '#ffffff',
                  borderWidth: 1
                }
              ]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: {
                  position: 'bottom',
                  labels: { boxWidth: 12, boxHeight: 12 }
                }
              }
            }
          };
        }
        var isLine = type === 'line';
        return {
          type: type,
          data: {
            labels: labels,
            datasets: [
              {
                label: datasetLabel,
                data: values,
                borderColor: '#b30000',
                backgroundColor: isLine ? 'rgba(179, 0, 0, 0.18)' : '#ff6f61',
                tension: isLine ? 0.35 : 0,
                fill: isLine,
                pointRadius: isLine ? 3 : 0,
                pointBackgroundColor: '#b30000',
                borderWidth: 2
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: {
                beginAtZero: true,
                ticks: { precision: 0 }
              },
              x: {
                ticks: { autoSkip: true, maxRotation: 0 }
              }
            },
            plugins: {
              legend: { display: true, position: 'bottom' },
              tooltip: {
                mode: 'index',
                intersect: false
              }
            }
          }
        };
      }

      function destroyDashboard(frameId) {
        if (chartInstances[frameId]) {
          chartInstances[frameId].destroy();
          delete chartInstances[frameId];
        }
      }

      function updateDashboardChart(frame, data, canvas) {
        if (!canvas || typeof Chart === 'undefined') return;
        destroyDashboard(frame.id);
        if (!data.length) {
          return;
        }
        chartInstances[frame.id] = new Chart(canvas.getContext('2d'), buildChartConfig(frame, data));
      }

      function incrementLoad() {
        pendingLoads++;
      }

      function decrementLoad() {
        pendingLoads--;
        if (pendingLoads <= 0) stopLoadingAnimation();
      }

      function startLoadingAnimation() {
        var overlay = document.getElementById('loading-overlay');
        var canvas = document.getElementById('loading-canvas');
        if (!overlay || !canvas) return;
        overlay.style.display = 'flex';
        var ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = canvas.clientHeight;

        var chars = 'アカサタナハマヤラワ漢字0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        chars = chars.split('');
        var fontSize = 20;
        var rows = Math.floor(canvas.height / fontSize);
        var positions = Array(rows).fill(0);

        function draw() {
          ctx.fillStyle = 'rgba(0,0,0,0.1)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#b30000';
          ctx.font = fontSize + 'px monospace';
          for (var i = 0; i < rows; i++) {
            var text = chars[Math.floor(Math.random() * chars.length)];
            ctx.fillText(text, positions[i], i * fontSize + fontSize);
            if (positions[i] > canvas.width) {
              positions[i] = 0;
            } else {
              positions[i] += fontSize;
            }
          }
        }

        loadingInterval = setInterval(draw, 50);
      }

      function stopLoadingAnimation() {
        var overlay = document.getElementById('loading-overlay');
        if (!overlay) return;
        if (loadingInterval) {
          clearInterval(loadingInterval);
          loadingInterval = null;
        }
        overlay.style.display = 'none';
      }

      function createDefaultSheet(r, c) {
        var data = [];
        for (var i = 0; i < r; i++) {
          var row = [];
          for (var j = 0; j < c; j++) row.push('');
          data.push(row);
        }
        return { rows: r, cols: c, data: data, computed: [] };
      }

      function lettersToIndex(letters) {
        var num = 0;
        for (var i = 0; i < letters.length; i++) {
          num = num * 26 + (letters.charCodeAt(i) - 64);
        }
        return num - 1;
      }

      function evaluateCell(sheet, r, c, visited) {
        var key = r + '_' + c;
        if (visited[key]) return '#CIRC';
        visited[key] = true;
        var val = sheet.data[r][c];
        if (val == null) return '';
        if (typeof val !== 'string' || val.charAt(0) !== '=') return val;
        var expr = val.substring(1);
        expr = expr.replace(/\^/g, '**');
        expr = expr.replace(/([A-Z]+)(\d+)/g, function(_, col, row) {
          var colIdx = lettersToIndex(col);
          var rowIdx = parseInt(row, 10) - 1;
          if (rowIdx < 0 || rowIdx >= sheet.rows || colIdx < 0 || colIdx >= sheet.cols) return 0;
          var res = evaluateCell(sheet, rowIdx, colIdx, visited);
          return res === '' ? 0 : res;
        });
        try {
          /* eslint no-new-func: 0 */
          return Function('return ' + expr)();
        } catch (e) {
          return '#ERR';
        }
      }

      function evaluateSheet(sheet) {
        sheet.computed = [];
        for (var r = 0; r < sheet.rows; r++) {
          sheet.computed[r] = [];
          for (var c = 0; c < sheet.cols; c++) {
            sheet.computed[r][c] = evaluateCell(sheet, r, c, {});
          }
        }
      }

      function renderSheet(container, index) {
        var sheet = frames[index].sheet;
        evaluateSheet(sheet);
        container.innerHTML = '';
        var table = document.createElement('table');
        var tbody = document.createElement('tbody');

        // Determine if there is a column titled "Diff" or "$ Diff"
        var diffCol = -1;
        if (sheet.rows > 0) {
          for (var dc = 0; dc < sheet.cols; dc++) {
            var header = (sheet.data[0][dc] || '').toString().toLowerCase();
            header = header.replace(/\s+/g, '');
            if (header === 'diff' || header === '$diff') {
              diffCol = dc;
              break;
            }
          }
        }

        for (var r = 0; r < sheet.rows; r++) {
          var tr = document.createElement('tr');
          for (var c = 0; c < sheet.cols; c++) {
            var td = document.createElement('td');
            td.contentEditable = true;
            td.textContent = sheet.computed[r][c];
            td.dataset.r = r;
            td.dataset.c = c;

            // Apply conditional colors for the Diff column
            if (diffCol !== -1 && c === diffCol && r > 0) {
              var val = parseFloat(sheet.computed[r][c]);
              if (!isNaN(val)) {
                if (val < 0) {
                  // Negative values -> red
                  td.style.backgroundColor = '#f8d7da';
                } else if (val > 0) {
                  // Positive values -> green
                  td.style.backgroundColor = '#d4edda';
                } else {
                  // Zero -> no color
                  td.style.backgroundColor = '';
                }
              }
            }

            (function(ridx, cidx, cell) {
              cell.addEventListener('focus', function() {
                cell.textContent = sheet.data[ridx][cidx] || '';
              });
              cell.addEventListener('blur', function() {
                sheet.data[ridx][cidx] = cell.textContent;
                evaluateSheet(sheet);
                renderSheet(container, index);
                saveFrames();
                refreshDashboard(index);
              });
            })(r, c, td);
            tr.appendChild(td);
          }
          tbody.appendChild(tr);
        }
        table.appendChild(tbody);
        container.appendChild(table);
      }

      function addRow(index) {
        var sheet = frames[index].sheet;
        var row = [];
        for (var i = 0; i < sheet.cols; i++) row.push('');
        sheet.data.push(row);
        sheet.rows++;
        evaluateSheet(sheet);
        var div = document.querySelector('.frame[data-index="' + index + '"] .spreadsheet');
        renderSheet(div, index);
        saveFrames();
        refreshDashboard(index);
      }

      function removeRow(index) {
        var sheet = frames[index].sheet;
        if (sheet.rows > 1) {
          sheet.data.pop();
          sheet.rows--;
          evaluateSheet(sheet);
          var div = document.querySelector('.frame[data-index="' + index + '"] .spreadsheet');
          renderSheet(div, index);
          saveFrames();
          refreshDashboard(index);
        }
      }

      function addColumn(index) {
        var sheet = frames[index].sheet;
        for (var i = 0; i < sheet.rows; i++) {
          sheet.data[i].push('');
        }
        sheet.cols++;
        evaluateSheet(sheet);
        var div = document.querySelector('.frame[data-index="' + index + '"] .spreadsheet');
        renderSheet(div, index);
        saveFrames();
        refreshDashboard(index);
      }

      function removeColumn(index) {
        var sheet = frames[index].sheet;
        if (sheet.cols > 1) {
          for (var i = 0; i < sheet.rows; i++) {
            sheet.data[i].pop();
          }
          sheet.cols--;
          evaluateSheet(sheet);
          var div = document.querySelector('.frame[data-index="' + index + '"] .spreadsheet');
          renderSheet(div, index);
          saveFrames();
          refreshDashboard(index);
        }
      }

      function updateFrameIndices() {
        var children = document.querySelectorAll('.viewing-area .frame');
        children.forEach(function(c, i) {
          c.dataset.index = i;
          if (frames[i]) c.dataset.frameId = frames[i].id;
        });
      }

      function enableDrag(el) {
        var startX, startY, startLeft, startTop, idx;

        el.addEventListener('mousedown', function(e) {
          if (framesLocked) return;
          if (
            e.target.classList.contains('resizer') ||
            e.target.classList.contains('frame-title') ||
            e.target.closest('.spreadsheet') ||
            e.target.classList.contains('sheet-btn') ||
            e.target.closest('.dashboard')
          )
            return;
          e.preventDefault();
          idx = parseInt(el.dataset.index, 10);
          startX = e.clientX;
          startY = e.clientY;
          startLeft = el.offsetLeft;
          startTop = el.offsetTop;
          el.style.zIndex = zIndex++;
          function move(ev) {
            var area = document.getElementById('viewing-area');
            var rect = area.getBoundingClientRect();
            var x = startLeft + ev.clientX - startX;
            var y = startTop + ev.clientY - startY;
            x = Math.max(0, Math.min(x, rect.width - el.offsetWidth));
            y = Math.max(0, Math.min(y, rect.height - el.offsetHeight));
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            frames[idx].x = x;
            frames[idx].y = y;
          }
          function up() {
            document.removeEventListener('mousemove', move);
            document.removeEventListener('mouseup', up);
            document.removeEventListener('mouseleave', up);
            saveFrames();
          }
          document.addEventListener('mousemove', move);
          document.addEventListener('mouseup', up);
          document.addEventListener('mouseleave', up);
        });
      }

      function enableResize(el, handle) {
        var startX, startY, startW, startH, idx;

        handle.addEventListener('mousedown', function(e) {
          if (framesLocked) return;
          e.stopPropagation();
          e.preventDefault();
          idx = parseInt(el.dataset.index, 10);
          startX = e.clientX;
          startY = e.clientY;
          startW = el.offsetWidth;
          startH = el.offsetHeight;
          el.style.zIndex = zIndex++;
          function move(ev) {
            var area = document.getElementById('viewing-area');
            var rect = area.getBoundingClientRect();
            var width = startW + ev.clientX - startX;
            var height = startH + ev.clientY - startY;
            width = Math.max(50, Math.min(width, rect.width - el.offsetLeft));
            height = Math.max(50, Math.min(height, rect.height - el.offsetTop));
            el.style.width = width + 'px';
            el.style.height = height + 'px';
            frames[idx].width = width;
            frames[idx].height = height;
          }
          function up() {
            document.removeEventListener('mousemove', move);
            document.removeEventListener('mouseup', up);
            document.removeEventListener('mouseleave', up);
            saveFrames();
          }
          document.addEventListener('mousemove', move);
          document.addEventListener('mouseup', up);
          document.addEventListener('mouseleave', up);
      });
      }

      function keepFramesInView() {
        if (!framesLoaded || framesLocked) return;
        var area = document.getElementById('viewing-area');
        var rect = area.getBoundingClientRect();
        var children = document.querySelectorAll('.viewing-area .frame');
        children.forEach(function(el) {
          var idx = parseInt(el.dataset.index, 10);
          var x = Math.max(0, Math.min(el.offsetLeft, rect.width - el.offsetWidth));
          var y = Math.max(0, Math.min(el.offsetTop, rect.height - el.offsetHeight));
          var width = Math.max(50, Math.min(el.offsetWidth, rect.width - x));
          var height = Math.max(50, Math.min(el.offsetHeight, rect.height - y));
          el.style.left = x + 'px';
          el.style.top = y + 'px';
          el.style.width = width + 'px';
          el.style.height = height + 'px';
          frames[idx].x = x;
          frames[idx].y = y;
          frames[idx].width = width;
          frames[idx].height = height;
        });
        saveFrames();
      }

      window.addEventListener('resize', keepFramesInView);

      function preloadImages(list, cb) {
        if (!list.length) {
          cb([]);
          return;
        }
        var remaining = list.length;
        var results = [];
        list.forEach(function(src) {
          var img = new Image();
          img.onload = img.onerror = function() {
            results.push(src);
            if (--remaining === 0) cb(results);
          };
          img.src = src;
        });
      }

      function startCarousel() {
        var track = document.getElementById('carousel-track');
        if (!track) return;
        track.innerHTML = '';
        track.style.animation = 'none';
        if (driverImages.length === 0) return;

        var carousel = document.getElementById('driver-carousel');
        var imgWidth = 250;
        var repeat = Math.max(2, Math.ceil(carousel.offsetWidth / (driverImages.length * imgWidth)) + 1);
        var images = [];
        for (var i = 0; i < repeat; i++) {
          images = images.concat(driverImages);
        }
        images.forEach(function(src) {
          var img = document.createElement('img');
          img.src = src;
          track.appendChild(img);
        });
        var duration = images.length * 5;
        void track.offsetWidth;
        track.style.animation = 'scroll-left ' + duration + 's linear infinite';
      }

document.addEventListener('DOMContentLoaded', function() {
  startLoadingAnimation();
});
    </script>
  </head>
